version: "3.9"

services:
  web:
    build: .
    container_name: party_management
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_NAME=party
      - DB_USER=party
      - DB_PASSWORD=party
      - DB_HOST=db
      - POSTGRES_DB=party
      - POSTGRES_USER=party
      - POSTGRES_PASSWORD=party
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app:rw

  db:
    image: postgres:15
    container_name: party_db
    environment:
      - POSTGRES_DB=party
      - POSTGRES_USER=party
      - POSTGRES_PASSWORD=party
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party -d party"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: